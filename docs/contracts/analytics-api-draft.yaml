    ComparisonOperator:
      type: string
      enum: [EQ, NE, GT, GTE, LT, LTE, BETWEEN, IN]
    TelemetryLiteral:
      oneOf:
        - { type: number }
        - { type: boolean }
        - { type: string }
    Condition:
      oneOf:
        - $ref: '#/components/schemas/AllCondition'
        - $ref: '#/components/schemas/AnyCondition'
        - $ref: '#/components/schemas/NotCondition'
        - $ref: '#/components/schemas/CompareCondition'
      discriminator:
        propertyName: type
        mapping:
          ALL: '#/components/schemas/AllCondition'
          ANY: '#/components/schemas/AnyCondition'
          NOT: '#/components/schemas/NotCondition'
          COMPARE: '#/components/schemas/CompareCondition'
    AllCondition:
      type: object
      additionalProperties: false
      required: [type, conditions]
      properties:
        type: { const: ALL }
        conditions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Condition' }
    AnyCondition:
      type: object
      additionalProperties: false
      required: [type, conditions]
      properties:
        type: { const: ANY }
        conditions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Condition' }
    NotCondition:
      type: object
      additionalProperties: false
      required: [type, condition]
      properties:
        type: { const: NOT }
        condition: { $ref: '#/components/schemas/Condition' }
    CompareCondition:
      type: object
      additionalProperties: false
      required: [type, signalId, operator]
      properties:
        type: { const: COMPARE }
        signalId: { type: string, format: uuid }
        operator: { $ref: '#/components/schemas/ComparisonOperator' }
        value: { $ref: '#/components/schemas/TelemetryLiteral' }
        tolerance: { type: number, exclusiveMinimum: 0 }
        lower: { $ref: '#/components/schemas/TelemetryLiteral' }
        upper: { $ref: '#/components/schemas/TelemetryLiteral' }
        values:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/TelemetryLiteral' }
