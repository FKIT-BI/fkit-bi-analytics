openapi: 3.1.0
info:
  title: FKIT BI Analytics API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Публичный API конфигурации, оперативного мониторинга, аналитики,
    ручных инцидентов и фонового перерасчёта FKIT BI.
    Raw telemetry ingestion и управление generator вынесены за границы контракта.
servers:
  - url: ../api/v1
security:
  - bearerAuth: []
tags:
  - { name: enterprises, description: Предприятия }
  - { name: shifts, description: Сменные расписания предприятия }
  - { name: loss-reasons, description: Справочник причин потерь }
  - { name: lines, description: Производственные линии }
  - { name: machines, description: Машины и активация }
  - { name: components, description: Дерево компонентов машины }
  - { name: telemetry-signals, description: Конфигурация сигналов }
  - { name: state-configuration, description: Декларативные правила состояния }
  - { name: operations, description: Операционные read models }
  - { name: telemetry, description: Текущая и историческая телеметрия }
  - { name: analytics, description: KPI и временные ряды }
  - { name: losses, description: Потери и Парето }
  - { name: chronometry, description: Хронометраж смен }
  - { name: intervals, description: Эффективные интервалы состояний }
  - { name: incidents, description: Ручные инциденты }
  - { name: recalculations, description: Фоновый перерасчёт состояний }
  - { name: authentication, description: Вход и первичная аутентификация }
  - { name: users, description: Создание учётных записей bootstrap-пользователем }

paths:
  /auth/login:
    post:
      tags: [authentication]
      operationId: login
      summary: Получить access token
      description: Публичный вход. Неверные credentials дают одинаковую ошибку для неизвестного пользователя и неверного пароля; лимит — 10 запросов в минуту с доверенного публичного IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            examples:
              operatorLogin:
                summary: Вход зарегистрированного пользователя
                value: { username: operator, password: 'replace-with-user-password' }
      responses:
        '200':
          description: JWT access token и сведения об аутентифицированном пользователе
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/users:
    post:
      tags: [users]
      operationId: createUser
      summary: Создать учётную запись
      description: Создаёт пользователя только для действующего bootstrap account; лимит — 5 запросов в минуту. Полномочие повторно проверяется сервером по записи в БД.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
            examples:
              operatorAccount:
                summary: Создание учётной записи оператора
                value: { username: engineer, displayName: 'Инженер смены', initialPassword: 'replace-with-initial-password' }
      responses:
        '201':
          description: Учётная запись создана
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /enterprises:
    get:
      tags: [enterprises]
      operationId: listEnterprises
      summary: Список предприятий
      description: Возвращает страницу предприятий с фильтрами по статусу и поиску; page и size управляют пагинацией.
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница предприятий
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnterprisePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [enterprises]
      operationId: createEnterprise
      summary: Создать предприятие
      description: Создаёт предприятие с уникальным кодом и timezone, используемой для календарей и временных проекций.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnterpriseCreate' }
      responses:
        '201':
          description: Предприятие создано
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enterprise' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /enterprises/{enterpriseId}:
    parameters:
      - $ref: '#/components/parameters/EnterpriseId'
    get:
      tags: [enterprises]
      operationId: getEnterprise
      summary: Получить предприятие
      description: Возвращает код, имя, timezone и статус одного предприятия.
      responses:
        '200':
          description: Предприятие
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enterprise' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [enterprises]
      operationId: updateEnterprise
      summary: Изменить предприятие
      description: Timezone блокируется после появления временных эксплуатационных данных.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnterpriseUpdate' }
      responses:
        '200':
          description: Обновлённое предприятие
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enterprise' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /enterprises/{enterpriseId}/status:
    parameters:
      - $ref: '#/components/parameters/EnterpriseId'
    put:
      tags: [enterprises]
      operationId: updateEnterpriseStatus
      summary: Изменить собственный статус предприятия
      description: Не изменяет статусы линий, машин и других дочерних объектов.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      responses:
        '200':
          description: Предприятие с новым статусом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enterprise' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /enterprises/{enterpriseId}/shifts:
    parameters:
      - $ref: '#/components/parameters/EnterpriseId'
    get:
      tags: [shifts]
      operationId: listShifts
      summary: Список смен предприятия
      description: Возвращает смены предприятия; validOn отбирает определения, действующие в указанную локальную дату.
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - name: validOn
          in: query
          example: '2026-10-12'
          description: Оставить определения, применимые к локальной дате.
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница смен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftPage' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [shifts]
      operationId: createShift
      summary: Создать смену
      description: Создаёт расписание смены с локальными границами и периодом действия для указанного предприятия.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftCreate' }
      responses:
        '201':
          description: Смена создана
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /shifts/{shiftId}:
    parameters:
      - $ref: '#/components/parameters/ShiftPathId'
    get:
      tags: [shifts]
      operationId: getShift
      summary: Получить смену
      description: Возвращает расписание смены и признаки использования её исторически значимых границ.
      responses:
        '200':
          description: Смена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [shifts]
      operationId: updateShift
      summary: Изменить смену
      description: Использованные границы и validFrom блокируются согласно календарю смен.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftUpdate' }
      responses:
        '200':
          description: Обновлённая смена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /shifts/{shiftId}/status:
    parameters:
      - $ref: '#/components/parameters/ShiftPathId'
    put:
      tags: [shifts]
      operationId: updateShiftStatus
      summary: Изменить статус смены
      description: Включает или отключает определение смены без удаления его истории.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      responses:
        '200':
          description: Смена с новым статусом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /enterprises/{enterpriseId}/loss-reasons:
    parameters:
      - $ref: '#/components/parameters/EnterpriseId'
    get:
      tags: [loss-reasons]
      operationId: listLossReasons
      summary: Список причин потерь предприятия
      description: Возвращает справочник причин потерь с фильтрами статуса, категории и поиском.
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - name: category
          in: query
          example: EQUIPMENT
          schema: { $ref: '#/components/schemas/LossCategory' }
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница причин потерь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LossReasonPage' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [loss-reasons]
      operationId: createLossReason
      summary: Создать причину потерь
      description: code уникален в Enterprise; name уникален без учёта регистра и крайних пробелов. Дубликат возвращает 409 LOSS_REASON_DUPLICATE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LossReasonCreate' }
      responses:
        '201':
          description: Причина создана
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LossReason' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /loss-reasons/{lossReasonId}:
    parameters:
      - $ref: '#/components/parameters/LossReasonId'
    get:
      tags: [loss-reasons]
      operationId: getLossReason
      summary: Получить причину потерь
      description: Возвращает детали причины, категорию, цвет и признак использования.
      responses:
        '200':
          description: Причина потерь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LossReason' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [loss-reasons]
      operationId: updateLossReason
      summary: Изменить причину потерь
      description: code и Enterprise неизменны; category блокируется после первого использования. Дубликат нормализованного name возвращает 409 LOSS_REASON_DUPLICATE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LossReasonUpdate' }
      responses:
        '200':
          description: Обновлённая причина
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LossReason' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /loss-reasons/{lossReasonId}/status:
    parameters:
      - $ref: '#/components/parameters/LossReasonId'
    put:
      tags: [loss-reasons]
      operationId: updateLossReasonStatus
      summary: Изменить статус причины потерь
      description: Включает или отключает причину потерь, сохраняя существующие ссылки и историю.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      responses:
        '200':
          description: Причина с новым статусом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LossReason' }
        '404': { $ref: '#/components/responses/NotFound' }

  /enterprises/{enterpriseId}/lines:
    parameters:
      - $ref: '#/components/parameters/EnterpriseId'
    get:
      tags: [lines]
      operationId: listLines
      summary: Список линий предприятия
      description: Возвращает производственные линии предприятия в порядке sortOrder с пагинацией.
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница линий
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionLinePage' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [lines]
      operationId: createLine
      summary: Создать линию
      description: Создаёт линию в пределах предприятия; код уникален внутри предприятия.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionLineCreate' }
      responses:
        '201':
          description: Линия создана
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionLine' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /lines/{lineId}:
    parameters:
      - $ref: '#/components/parameters/LineId'
    get:
      tags: [lines]
      operationId: getLine
      summary: Получить линию
      description: Возвращает паспорт линии и её статус.
      responses:
        '200':
          description: Линия
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionLine' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [lines]
      operationId: updateLine
      summary: Изменить линию
      description: Обновляет отображаемое имя и порядок линии, не перемещая машины автоматически.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionLineUpdate' }
      responses:
        '200':
          description: Обновлённая линия
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionLine' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /lines/{lineId}/status:
    parameters:
      - $ref: '#/components/parameters/LineId'
    put:
      tags: [lines]
      operationId: updateLineStatus
      summary: Изменить собственный статус линии
      description: Не меняет статусы машин.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      responses:
        '200':
          description: Линия с новым статусом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionLine' }
        '404': { $ref: '#/components/responses/NotFound' }

  /enterprises/{enterpriseId}/machines:
    parameters:
      - $ref: '#/components/parameters/EnterpriseId'
    get:
      tags: [machines]
      operationId: listEnterpriseMachines
      summary: Список машин предприятия
      description: Возвращает машины предприятия; lineId фильтрует назначенные линии, отсутствие фильтра включает весь парк.
      parameters:
        - name: lineId
          in: query
          example: 20000000-0000-0000-0000-000000000001
          schema: { type: string, format: uuid }
        - name: assignment
          in: query
          example: ASSIGNED
          schema:
            type: string
            enum: [ALL, ASSIGNED, UNASSIGNED]
            default: ALL
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница машин
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachinePage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [machines]
      operationId: createMachine
      summary: Создать отключённую машину
      description: Optional lineId позволяет создать назначенную или свободную машину.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MachineCreate' }
      responses:
        '201':
          description: Машина создана в DISABLED
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Machine' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /lines/{lineId}/machines:
    parameters:
      - $ref: '#/components/parameters/LineId'
    get:
      tags: [machines]
      operationId: listLineMachines
      summary: Список машин линии
      description: Возвращает машины, назначенные конкретной линии, в стабильном порядке.
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница машин линии
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachinePage' }
        '404': { $ref: '#/components/responses/NotFound' }

  /machines/{machineId}:
    parameters:
      - $ref: '#/components/parameters/MachineId'
    get:
      tags: [machines]
      operationId: getMachine
      summary: Получить машину
      description: Возвращает паспорт машины, параметры, статус и границу доступного telemetry coverage.
      responses:
        '200':
          description: Машина
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Machine' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [machines]
      operationId: updateMachine
      summary: Изменить паспортные и производственные поля машины
      description: Обновляет паспорт и полный набор typed parameters машины; переданные параметры заменяют прежний набор.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MachineUpdate' }
      responses:
        '200':
          description: Обновлённая машина
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Machine' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /machines/{machineId}/status:
    parameters:
      - $ref: '#/components/parameters/MachineId'
    put:
      tags: [machines]
      operationId: updateMachineStatus
      summary: Активировать или отключить машину
      description: Переход в ACTIVE атомарно повторяет activation readiness validation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      responses:
        '200':
          description: Машина с новым статусом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Machine' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /machines/{machineId}/activation-readiness:
    parameters:
      - $ref: '#/components/parameters/MachineId'
    get:
      tags: [machines]
      operationId: getMachineActivationReadiness
      summary: Проверить готовность машины к активации
      description: Проверяет обязательную конфигурацию и возвращает блокирующие ошибки и предупреждения без изменения статуса.
      responses:
        '200':
          description: Полный список ошибок и предупреждений
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivationReadiness' }
        '404': { $ref: '#/components/responses/NotFound' }

  /lines/{lineId}/machine-assignments:
    parameters:
      - $ref: '#/components/parameters/LineId'
    post:
      tags: [machines]
      operationId: assignMachinesToLine
      summary: Атомарно назначить свободные машины линии
      description: Атомарно назначает указанные машины линии после проверки владельца и отсутствия других назначений.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MachineAssignmentsCreate' }
      responses:
        '200':
          description: Назначенные машины в порядке запроса
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Machine' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /machines/{machineId}/components:
    parameters:
      - $ref: '#/components/parameters/MachineId'
    get:
      tags: [components]
      operationId: listMachineComponents
      summary: Получить плоский список компонентов машины
      description: Возвращает компоненты машины в порядке parent, sortOrder и code вместе с typed parameters.
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: Компоненты в порядке parent, sortOrder, code
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Component' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [components]
      operationId: createComponent
      summary: Создать компонент внутри машины
      description: Создаёт компонент машины и при необходимости помещает его под существующего родителя.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComponentCreate' }
      responses:
        '201':
          description: Компонент создан
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Component' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /components/{componentId}:
    parameters:
      - $ref: '#/components/parameters/ComponentId'
    get:
      tags: [components]
      operationId: getComponent
      summary: Получить компонент
      description: Возвращает компонент, его родителя, kind, параметры и статус.
      responses:
        '200':
          description: Компонент
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Component' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [components]
      operationId: updateComponent
      summary: Изменить компонент без parent и status
      description: Обновляет имя, вид, порядок и полный набор typed parameters компонента.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComponentUpdate' }
      responses:
        '200':
          description: Обновлённый компонент
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Component' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /components/{componentId}/parent:
    parameters:
      - $ref: '#/components/parameters/ComponentId'
    put:
      tags: [components]
      operationId: updateComponentParent
      summary: Изменить родителя компонента внутри машины
      description: Переносит компонент под указанного родителя или в корень дерева; циклическое родство отклоняется.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComponentParentUpdate' }
      responses:
        '200':
          description: Компонент с новым parent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Component' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /components/{componentId}/status:
    parameters:
      - $ref: '#/components/parameters/ComponentId'
    put:
      tags: [components]
      operationId: updateComponentStatus
      summary: Изменить собственный статус компонента
      description: Не изменяет status дочерних компонентов или сигналов.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      responses:
        '200':
          description: Компонент с новым статусом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Component' }
        '404': { $ref: '#/components/responses/NotFound' }

  /machines/{machineId}/telemetry-signals:
    parameters:
      - $ref: '#/components/parameters/MachineId'
    get:
      tags: [telemetry-signals]
      operationId: listTelemetrySignals
      summary: Список сигналов машины
      description: Возвращает конфигурацию сигналов машины с фильтрами статуса, kind и поиска.
      parameters:
        - name: componentId
          in: query
          example: 21000000-0000-0000-0000-000000000001
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/StatusFilter'
        - name: semanticCode
          in: query
          example: MOTOR_TEMPERATURE
          schema: { type: string }
        - name: signalKind
          in: query
          example: GAUGE
          schema: { $ref: '#/components/schemas/SignalKind' }
        - name: featured
          in: query
          example: true
          schema: { type: boolean }
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница сигналов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetrySignalPage' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [telemetry-signals]
      operationId: createTelemetrySignal
      summary: Создать сигнал машины
      description: Регистрирует тип, семантику, единицы, интервалы измерений и featured-настройки нового сигнала.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelemetrySignalCreate' }
      responses:
        '201':
          description: Сигнал создан
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetrySignal' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /telemetry-signals/{signalId}:
    parameters:
      - $ref: '#/components/parameters/SignalId'
    get:
      tags: [telemetry-signals]
      operationId: getTelemetrySignal
      summary: Получить сигнал
      description: Возвращает конфигурацию сигнала и признак наличия raw measurements.
      responses:
        '200':
          description: Сигнал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetrySignal' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [telemetry-signals]
      operationId: updateTelemetrySignal
      summary: Изменить допустимые поля сигнала
      description: Смысловые поля блокируются после первого raw measurement.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelemetrySignalUpdate' }
      responses:
        '200':
          description: Обновлённый сигнал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetrySignal' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /telemetry-signals/{signalId}/status:
    parameters:
      - $ref: '#/components/parameters/SignalId'
    put:
      tags: [telemetry-signals]
      operationId: updateTelemetrySignalStatus
      summary: Изменить статус сигнала
      description: Отключение referenced signal активной машины возвращает конфликт.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      responses:
        '200':
          description: Сигнал с новым статусом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetrySignal' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /machines/{machineId}/state-configuration:
    parameters:
      - $ref: '#/components/parameters/MachineId'
    get:
      tags: [state-configuration]
      operationId: getMachineStateConfiguration
      summary: Получить текущую конфигурацию определения состояния
      description: Возвращает default state, порог offline и декларативные правила машины.
      responses:
        '200':
          description: Текущая конфигурация
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineStateConfiguration' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [state-configuration]
      operationId: replaceMachineStateConfiguration
      summary: Атомарно заменить текущую конфигурацию
      description: Полностью заменяет правила определения состояния после проверки ссылок на сигналы.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MachineStateConfigurationInput' }
      responses:
        '200':
          description: Нормализованная сохранённая конфигурация
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineStateConfiguration' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /machines/{machineId}/state-configuration/validate:
    parameters:
      - $ref: '#/components/parameters/MachineId'
    post:
      tags: [state-configuration]
      operationId: validateMachineStateConfiguration
      summary: Проверить конфигурацию без сохранения
      description: Валидирует и нормализует документ правил, не меняя сохранённую конфигурацию машины.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MachineStateConfigurationInput' }
      responses:
        '200':
          description: Результат проверки и нормализованный документ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StateConfigurationValidation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /enterprises/{enterpriseId}/equipment-tree:
    parameters:
      - $ref: '#/components/parameters/EnterpriseId'
    get:
      tags: [operations]
      operationId: getEquipmentTree
      summary: Получить компактное дерево линий и машин
      description: Не содержит компонентов, сигналов, текущих состояний или KPI.
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Дерево и отдельная группа неназначенных машин
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentTree' }
        '404': { $ref: '#/components/responses/NotFound' }

  /enterprises/{enterpriseId}/operations/overview:
    parameters:
      - $ref: '#/components/parameters/EnterpriseId'
    get:
      tags: [operations]
      operationId: getEnterpriseOperationsOverview
      summary: Получить текущий обзор машин предприятия
      description: Возвращает агрегированные current cards и количества машин по состояниям предприятия.
      parameters:
        - name: lineId
          in: query
          example: 20000000-0000-0000-0000-000000000001
          schema: { type: string, format: uuid }
        - name: includeDisabled
          in: query
          example: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Current cards и агрегированные количества состояний
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationsOverview' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /machines/{machineId}/operations/current:
    parameters:
      - $ref: '#/components/parameters/MachineId'
    get:
      tags: [operations]
      operationId: getMachineOperationsCurrent
      summary: Получить оперативную карточку машины
      description: Возвращает паспортный header, effective current state и featured signal values.
      responses:
        '200':
          description: Оперативная карточка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineOperationsCurrent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /machines/{machineId}/telemetry/current:
    parameters:
      - $ref: '#/components/parameters/MachineId'
    get:
      tags: [telemetry]
      operationId: getMachineTelemetryCurrent
      summary: Получить текущие значения сигналов машины
      description: Возвращает проекции выбранных или всех сигналов с quality и freshness каждого значения.
      parameters:
        - name: signalId
          in: query
          description: Повторяемый UUID сигнала; при отсутствии возвращаются все подходящие сигналы.
          example: [30000000-0000-0000-0000-000000000001]
          schema:
            type: array
            maxItems: 100
            items: { type: string, format: uuid }
          style: form
          explode: true
        - name: featuredOnly
          in: query
          example: true
          schema: { type: boolean, default: false }
        - name: includeDisabled
          in: query
          description: Включить в результат отключённые сигналы; по умолчанию возвращаются только ACTIVE.
          example: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Текущие проекции сигналов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentTelemetryResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /machines/{machineId}/current-state:
    parameters:
      - $ref: '#/components/parameters/MachineId'
    get:
      tags: [operations]
      operationId: getMachineCurrentState
      summary: Получить committed current state машины
      description: Возвращает только подготовленную current projection, не сканируя raw telemetry.
      responses:
        '200':
          description: Текущее рассчитанное состояние
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentState' }
        '404': { $ref: '#/components/responses/NotFound' }

  /analytics/summary:
    get:
      tags: [analytics]
      operationId: getAnalyticsSummary
      summary: Получить показатели периода и optional previous period
      description: |
        Принимает from+to с optional shiftId либо shiftId+shiftDate без from/to.
        compare=PREVIOUS_PERIOD использует предыдущий диапазон той же длины или предыдущую occurrence той же Shift.
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/ScopeId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/ShiftQueryId'
        - $ref: '#/components/parameters/ShiftDate'
        - name: compare
          in: query
          example: PREVIOUS_PERIOD
          schema:
            type: string
            enum: [NONE, PREVIOUS_PERIOD]
            default: PREVIOUS_PERIOD
      responses:
        '200':
          description: Сводка показателей
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /analytics/metrics/timeseries:
    get:
      tags: [analytics]
      operationId: getMetricTimeseries
      summary: Получить временной ряд производственных показателей
      description: Возвращает ограниченный по точкам ряд KPI для области, временного диапазона и разрешения.
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/ScopeId'
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - $ref: '#/components/parameters/ShiftQueryId'
        - $ref: '#/components/parameters/Resolution'
      responses:
        '200':
          description: Metric timeseries не более 1000 точек
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricTimeseries' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /machines/{machineId}/telemetry/series:
    parameters:
      - $ref: '#/components/parameters/MachineId'
    get:
      tags: [telemetry]
      operationId: getTelemetrySeries
      summary: Получить агрегированный числовой ряд одного сигнала
      description: STATE и ненумерический signal возвращают несовместимость запроса.
      parameters:
        - name: signalId
          in: query
          required: true
          example: 30000000-0000-0000-0000-000000000001
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - $ref: '#/components/parameters/Resolution'
      responses:
        '200':
          description: Ряд GAUGE либо COUNTER не более 720 точек
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetrySeries' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /analytics/losses/timeseries:
    get:
      tags: [losses]
      operationId: getLossTimeseries
      summary: Получить потери по времени и причинам
      description: Возвращает длительность потерь по временным интервалам и причинам для заданной области.
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/ScopeId'
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - $ref: '#/components/parameters/ShiftQueryId'
        - $ref: '#/components/parameters/Resolution'
        - $ref: '#/components/parameters/TopReasons'
      responses:
        '200':
          description: Loss timeseries не более 1000 точек
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LossTimeseries' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /analytics/losses/pareto:
    get:
      tags: [losses]
      operationId: getLossPareto
      summary: Получить Парето причин потерь
      description: Ранжирует причины потерь по длительности и возвращает долю выбранного набора причин.
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/ScopeId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/ShiftQueryId'
        - $ref: '#/components/parameters/ShiftDate'
        - $ref: '#/components/parameters/TopReasons'
      responses:
        '200':
          description: Pareto rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LossPareto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /machines/{machineId}/chronometry:
    parameters:
      - $ref: '#/components/parameters/MachineId'
    get:
      tags: [chronometry]
      operationId: getMachineChronometry
      summary: Получить хронометраж смен локальной даты
      description: Без shiftId возвращает все occurrences, начинающиеся в shiftDate.
      parameters:
        - name: shiftDate
          in: query
          required: true
          example: '2026-10-12'
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/ShiftQueryId'
      responses:
        '200':
          description: Хронометраж не более 10000 intervals во всём ответе
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChronometryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /machines/{machineId}/state-intervals:
    parameters:
      - $ref: '#/components/parameters/MachineId'
    get:
      tags: [intervals]
      operationId: listMachineStateIntervals
      summary: Получить effective state intervals для таблицы
      description: Возвращает cursor-page эффективных интервалов состояний с фильтром источника и периода.
      parameters:
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - name: state
          in: query
          example: [RUN, DOWN]
          schema:
            type: array
            items: { $ref: '#/components/schemas/MachineState' }
          style: form
          explode: true
        - name: lossReasonId
          in: query
          example: 60000000-0000-0000-0000-000000000001
          schema: { type: string, format: uuid }
        - name: unclassifiedOnly
          in: query
          example: false
          schema: { type: boolean, default: false }
        - name: lossOnly
          in: query
          example: false
          schema: { type: boolean, default: false }
        - name: source
          in: query
          example: CALCULATED
          schema: { $ref: '#/components/schemas/StateSource' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor page интервалов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StateIntervalPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /enterprises/{enterpriseId}/incidents:
    parameters:
      - $ref: '#/components/parameters/EnterpriseId'
    get:
      tags: [incidents]
      operationId: listEnterpriseIncidents
      summary: Получить общий журнал инцидентов предприятия
      description: Возвращает инциденты машин предприятия с фильтрами периода и типа эффекта.
      parameters:
        - name: machineId
          in: query
          example: 20000000-0000-0000-0000-000000000001
          schema: { type: string, format: uuid }
        - name: lineId
          in: query
          example: 20000000-0000-0000-0000-000000000001
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: effectType
          in: query
          example: STATE_OVERRIDE_WITH_REASON
          schema: { $ref: '#/components/schemas/IncidentEffectType' }
        - name: lossReasonId
          in: query
          example: 60000000-0000-0000-0000-000000000001
          schema: { type: string, format: uuid }
        - name: ongoing
          in: query
          example: true
          schema: { type: boolean }
        - name: includeCancelled
          in: query
          example: false
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor page инцидентов предприятия
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualIncidentPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /machines/{machineId}/incidents:
    parameters:
      - $ref: '#/components/parameters/MachineId'
    get:
      tags: [incidents]
      operationId: listMachineIncidents
      summary: Получить журнал ручных инцидентов машины
      description: Возвращает историю ручных инцидентов указанной машины в cursor-порядке.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: effectType
          in: query
          example: LOSS_ANNOTATION
          schema: { $ref: '#/components/schemas/IncidentEffectType' }
        - name: lossReasonId
          in: query
          example: 60000000-0000-0000-0000-000000000001
          schema: { type: string, format: uuid }
        - name: ongoing
          in: query
          example: true
          schema: { type: boolean }
        - name: includeCancelled
          in: query
          example: false
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor page инцидентов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualIncidentPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [incidents]
      operationId: createManualIncident
      summary: Создать ручной инцидент
      description: Повтор с тем же Idempotency-Key и тем же body возвращает исходный результат; тот же ключ с другим body возвращает 409 IDEMPOTENCY_KEY_REUSED. Повторный state или reason effect возвращает отдельный 409 INCIDENT_STATE_OVERLAP или INCIDENT_REASON_OVERLAP; reason-only без eligible state coverage возвращает 409 INCIDENT_HAS_NO_LOSS_INTERVAL.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualIncidentCreate' }
      responses:
        '201':
          description: Инцидент создан; зависимая аналитика актуализируется асинхронно
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualIncident' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /incidents/{incidentId}:
    parameters:
      - $ref: '#/components/parameters/IncidentId'
    get:
      tags: [incidents]
      operationId: getManualIncident
      summary: Получить ручной инцидент
      description: Возвращает интервал инцидента, эффекты, автора и актуальность зависимого перерасчёта.
      responses:
        '200':
          description: Инцидент
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualIncident' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [incidents]
      operationId: updateManualIncident
      summary: Изменить границы, эффекты или комментарий
      description: Обновляет интервал и эффекты ручной аннотации с повторной проверкой пересечений и доступности данных.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualIncidentUpdate' }
      responses:
        '200':
          description: Обновлённый инцидент
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualIncident' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [incidents]
      operationId: cancelManualIncident
      summary: Мягко отменить инцидент
      description: Idempotent; физическая строка и история сохраняются.
      responses:
        '204': { description: Инцидент отменён или уже был отменён }
        '404': { $ref: '#/components/responses/NotFound' }

  /incidents/{incidentId}/close:
    parameters:
      - $ref: '#/components/parameters/IncidentId'
    put:
      tags: [incidents]
      operationId: closeManualIncident
      summary: Закрыть ongoing incident
      description: Повтор с той же границей idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualIncidentClose' }
      responses:
        '200':
          description: Закрытый инцидент
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualIncident' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /machines/{machineId}/state-recalculations:
    parameters:
      - $ref: '#/components/parameters/MachineId'
    get:
      tags: [recalculations]
      operationId: listMachineStateRecalculations
      summary: Получить журнал пользовательских перерасчётов
      description: Возвращает cursor-page фоновых jobs перерасчёта с фильтром статуса.
      parameters:
        - name: status
          in: query
          example: RUNNING
          schema: { $ref: '#/components/schemas/RecalculationStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor page jobs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StateRecalculationPage' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [recalculations]
      operationId: createStateRecalculation
      summary: Запустить PERIOD или ALL перерасчёт
      description: >
        PERIOD строится от устойчивого предшествующего state interval и доступного raw-контекста.
        ALL пересчитывает от coverageFrom; оба режима требуют сохранённые raw partitions
        и не более 500000 raw events. При недоступном контексте возвращается 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StateRecalculationCreate' }
      responses:
        '202':
          description: Job принят
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StateRecalculation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /state-recalculations/{recalculationId}:
    parameters:
      - $ref: '#/components/parameters/RecalculationId'
    get:
      tags: [recalculations]
      operationId: getStateRecalculation
      summary: Получить состояние перерасчёта
      description: Возвращает статус job, диапазон, прогресс и последнюю ошибку фонового перерасчёта.
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StateRecalculation' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [recalculations]
      operationId: cancelStateRecalculation
      summary: Отменить перерасчёт до захвата worker
      description: Только PENDING job без активной worker lease отменяется; после claim возвращается 409.
      responses:
        '200':
          description: Отменённая job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StateRecalculation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    Location:
      description: URI созданного ресурса
      schema: { type: string, format: uri-reference }

  parameters:
    EnterpriseId:
      name: enterpriseId
      in: path
      required: true
      example: 10000000-0000-0000-0000-000000000001
      schema: { type: string, format: uuid }
    ShiftPathId:
      name: shiftId
      in: path
      required: true
      example: 70000000-0000-0000-0000-000000000001
      schema: { type: string, format: uuid }
    LossReasonId:
      name: lossReasonId
      in: path
      required: true
      example: 60000000-0000-0000-0000-000000000001
      schema: { type: string, format: uuid }
    LineId:
      name: lineId
      in: path
      required: true
      example: 20000000-0000-0000-0000-000000000001
      schema: { type: string, format: uuid }
    MachineId:
      name: machineId
      in: path
      required: true
      example: 20000000-0000-0000-0000-000000000001
      schema: { type: string, format: uuid }
    ComponentId:
      name: componentId
      in: path
      required: true
      example: 21000000-0000-0000-0000-000000000001
      schema: { type: string, format: uuid }
    SignalId:
      name: signalId
      in: path
      required: true
      example: 30000000-0000-0000-0000-000000000001
      schema: { type: string, format: uuid }
    IncidentId:
      name: incidentId
      in: path
      required: true
      example: 80000000-0000-0000-0000-000000000001
      schema: { type: string, format: uuid }
    RecalculationId:
      name: recalculationId
      in: path
      required: true
      example: 90000000-0000-0000-0000-000000000001
      schema: { type: string, format: uuid }
    StatusFilter:
      name: status
      in: query
      example: ACTIVE
      description: Без параметра возвращаются только ACTIVE ресурсы; укажите DISABLED для списка отключённых ресурсов.
      schema:
        allOf:
          - $ref: '#/components/schemas/ConfigStatus'
        default: ACTIVE
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      example: incident-create-20261012
      description: Один ключ используется при повторах одного create-запроса; scope — authenticated user и operation.
      schema: { type: string, minLength: 8, maxLength: 128 }
    Search:
      name: search
      in: query
      example: MOTOR
      schema: { type: string, minLength: 1, maxLength: 100 }
    Page:
      name: page
      in: query
      example: 0
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      example: 50
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      example: eyJvZmZzZXQiOjEwMH0
      description: Opaque cursor из предыдущего ответа.
      schema: { type: string, maxLength: 2048 }
    Limit:
      name: limit
      in: query
      example: 100
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Scope:
      name: scope
      in: query
      required: true
      example: MACHINE
      schema: { $ref: '#/components/schemas/AnalyticsScope' }
    ScopeId:
      name: scopeId
      in: query
      required: true
      example: 20000000-0000-0000-0000-000000000001
      schema: { type: string, format: uuid }
    From:
      name: from
      in: query
      example: '2026-10-01T00:00:00Z'
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      example: '2026-10-02T00:00:00Z'
      schema: { type: string, format: date-time }
    FromRequired:
      name: from
      in: query
      required: true
      example: '2026-10-01T00:00:00Z'
      schema: { type: string, format: date-time }
    ToRequired:
      name: to
      in: query
      required: true
      example: '2026-10-02T00:00:00Z'
      schema: { type: string, format: date-time }
    ShiftQueryId:
      name: shiftId
      in: query
      example: 70000000-0000-0000-0000-000000000001
      schema: { type: string, format: uuid }
    ShiftDate:
      name: shiftDate
      in: query
      example: '2026-10-12'
      schema: { type: string, format: date }
    Resolution:
      name: resolution
      in: query
      example: 15m
      schema: { $ref: '#/components/schemas/Resolution' }
    TopReasons:
      name: top
      in: query
      example: 5
      schema: { type: integer, minimum: 1, maximum: 20, default: 5 }

  responses:
    AuthenticationFailed:
      description: Неверные credentials либо недействительный или просроченный bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Пользователь не имеет права создавать учётные записи
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Превышен лимит запросов; повторите после Retry-After
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: Некорректный JSON, query или сочетание параметров
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Нарушение доменного инварианта или конфликт текущего состояния; повтор Idempotency-Key с другим body возвращает IDEMPOTENCY_KEY_REUSED.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnprocessableEntity:
      description: Ошибки полей или декларативной конфигурации
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Непредвиденная ошибка
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    LoginRequest:
      type: object
      example: { username: operator, password: 'replace-with-user-password' }
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$', description: Username нормализуется к нижнему регистру. }
        password: { type: string, minLength: 12, maxLength: 72, writeOnly: true }
    LoginResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string, minLength: 1 }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, const: 1800 }
        user:
          type: object
          additionalProperties: false
          required: [id, username, displayName, canCreateUsers]
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            displayName: { type: string }
            canCreateUsers: { type: boolean, description: Подсказка интерфейсу; POST /auth/users отдельно проверяет право на сервере. }
    UserCreate:
      type: object
      example: { username: engineer, displayName: 'Инженер смены', initialPassword: 'replace-with-initial-password' }
      additionalProperties: false
      required: [username, displayName, initialPassword]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        initialPassword: { type: string, minLength: 12, maxLength: 72, writeOnly: true, description: UTF-8 представление пароля ограничено 72 байтами для BCrypt. }
    User:
      type: object
      additionalProperties: false
      required: [id, username, displayName, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
    ConfigStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    MachineState:
      type: string
      enum: [RUN, IDLE, DOWN, SETUP, PLANNED_STOP, OFFLINE]
    UserMachineState:
      type: string
      enum: [RUN, IDLE, DOWN, SETUP, PLANNED_STOP]
    ManualStateOverride:
      type: string
      enum: [SETUP, PLANNED_STOP]
    AnalyticsScope:
      type: string
      enum: [MACHINE, LINE, ENTERPRISE]
    Resolution:
      type: string
      enum: [AUTO, 5m, 15m, 1h, 1d]
      default: AUTO
    AppliedResolution:
      type: string
      enum: [5m, 15m, 1h, 1d]
    StateSource:
      type: string
      enum: [CALCULATED, MANUAL]
    EvaluationQuality:
      type: string
      enum: [COMPLETE, DEGRADED]
    Freshness:
      type: string
      enum: [NO_DATA, FRESH, STALE]
    TelemetryQuality:
      type: string
      enum: [GOOD, UNCERTAIN, BAD]
    SignalKind:
      type: string
      enum: [GAUGE, COUNTER, STATE]
    SignalValueType:
      type: string
      enum: [DOUBLE, LONG, BOOLEAN, STRING]
    LossCategory:
      type: string
      enum: [EQUIPMENT, MATERIAL, PERSONNEL, PROCESS, QUALITY, CHANGEOVER, EXTERNAL, OTHER]
    IncidentEffectType:
      type: string
      enum: [STATE_OVERRIDE, LOSS_ANNOTATION, STATE_OVERRIDE_WITH_REASON]
    RecalculationStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED]

    FieldError:
      type: object
      required: [path, code, message]
      properties:
        path: { type: string, example: 'rules[0].enterCondition.value' }
        code: { type: string, example: TYPE_MISMATCH }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [code, message, traceId, fieldErrors, details]
      properties:
        code: { type: string, example: MACHINE_ALREADY_ASSIGNED }
        message: { type: string }
        traceId: { type: string }
        fieldErrors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        details:
          type: object
          additionalProperties: true

    PageMetadata:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    CursorMetadata:
      type: object
      required: [limit, hasMore]
      properties:
        limit: { type: integer, minimum: 1 }
        hasMore: { type: boolean }
        nextCursor: { type: [string, "null"] }

    StatusUpdate:
      type: object
      example: { status: DISABLED }
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ConfigStatus' }

    EnterpriseCreate:
      type: object
      example: { code: FLEXO_01, name: 'Завод полимерной упаковки', timezone: Europe/Moscow }
      additionalProperties: false
      required: [code, name, timezone]
      properties:
        code: { $ref: '#/components/schemas/StableCode' }
        name: { $ref: '#/components/schemas/DisplayName' }
        timezone: { type: string, minLength: 1, maxLength: 100, example: Europe/Moscow }
    EnterpriseUpdate:
      type: object
      example: { name: 'Завод полимерной упаковки', timezone: Europe/Moscow }
      additionalProperties: false
      required: [name, timezone]
      properties:
        name: { $ref: '#/components/schemas/DisplayName' }
        timezone: { type: string, minLength: 1, maxLength: 100, example: Europe/Moscow }
    Enterprise:
      allOf:
        - $ref: '#/components/schemas/EnterpriseCreate'
        - type: object
          required: [id, status, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/ConfigStatus' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    EnterprisePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Enterprise' }
        page: { $ref: '#/components/schemas/PageMetadata' }

    ShiftCreate:
      type: object
      example: { code: DAY, name: 'Дневная смена', startLocalTime: '08:00', endLocalTime: '20:00', validFrom: '2026-01-01', validTo: null, sortOrder: 0 }
      additionalProperties: false
      required: [code, name, startLocalTime, endLocalTime, validFrom]
      properties:
        code: { $ref: '#/components/schemas/StableCode' }
        name: { $ref: '#/components/schemas/DisplayName' }
        startLocalTime: { $ref: '#/components/schemas/LocalMinuteTime' }
        endLocalTime: { $ref: '#/components/schemas/LocalMinuteTime' }
        validFrom: { type: string, format: date }
        validTo: { type: [string, "null"], format: date }
        sortOrder: { type: integer, minimum: 0, default: 0 }
    ShiftUpdate:
      type: object
      example: { name: 'Дневная смена', startLocalTime: '08:00', endLocalTime: '20:00', validFrom: '2026-01-01', validTo: null, sortOrder: 0 }
      additionalProperties: false
      required: [name, startLocalTime, endLocalTime, validFrom, sortOrder]
      properties:
        name: { $ref: '#/components/schemas/DisplayName' }
        startLocalTime: { $ref: '#/components/schemas/LocalMinuteTime' }
        endLocalTime: { $ref: '#/components/schemas/LocalMinuteTime' }
        validFrom: { type: string, format: date }
        validTo: { type: [string, "null"], format: date }
        sortOrder: { type: integer, minimum: 0 }
    Shift:
      type: object
      required: [id, enterpriseId, code, name, startLocalTime, endLocalTime, validFrom, sortOrder, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        enterpriseId: { type: string, format: uuid }
        code: { $ref: '#/components/schemas/StableCode' }
        name: { $ref: '#/components/schemas/DisplayName' }
        startLocalTime: { $ref: '#/components/schemas/LocalMinuteTime' }
        endLocalTime: { $ref: '#/components/schemas/LocalMinuteTime' }
        validFrom: { type: string, format: date }
        validTo: { type: [string, "null"], format: date }
        sortOrder: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/ConfigStatus' }
