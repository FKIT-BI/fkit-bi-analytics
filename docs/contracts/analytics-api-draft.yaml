        lines:
          type: array
          items: { $ref: '#/components/schemas/EquipmentTreeLine' }
        unassignedMachines:
          type: array
          items: { $ref: '#/components/schemas/EquipmentTreeMachine' }
        generatedAt: { type: string, format: date-time }

    ProjectionCurrency:
      type: object
      required: [stale, recalculating]
      properties:
        dataThrough: { type: [string, "null"], format: date-time }
        calculatedAt: { type: [string, "null"], format: date-time }
        stale: { type: boolean }
        recalculating: { type: boolean }
    CurrentState:
      type: object
      required: [effectiveState, calculatedState, stateSource, stateSince, evaluationQuality, dataThrough, calculatedAt, stale, recalculating]
      properties:
        effectiveState: { $ref: '#/components/schemas/MachineState' }
        calculatedState: { $ref: '#/components/schemas/MachineState' }
        stateSource: { $ref: '#/components/schemas/StateSource' }
        stateSince: { type: string, format: date-time }
        matchedRuleId: { type: [string, "null"], format: uuid }
        stateIncidentId: { type: [string, "null"], format: uuid }
        reasonIncidentId: { type: [string, "null"], format: uuid }
        lossReason:
          oneOf:
            - $ref: '#/components/schemas/LossReasonSummary'
            - type: "null"
        evaluationQuality: { $ref: '#/components/schemas/EvaluationQuality' }
        lastTelemetryObservedAt: { type: [string, "null"], format: date-time }
        underlyingOffline: { type: boolean }
        dataThrough: { type: string, format: date-time }
        calculatedAt: { type: string, format: date-time }
        stale: { type: boolean }
        recalculating: { type: boolean }
    LossReasonSummary:
      type: object
      required: [id, code, name, category, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        category: { $ref: '#/components/schemas/LossCategory' }
        color: { type: [string, "null"] }
        status: { $ref: '#/components/schemas/ConfigStatus' }
    TelemetryValue:
      oneOf:
        - { type: number }
        - { type: boolean }
        - { type: string }
        - { type: "null" }
    CurrentSignalValue:
      type: object
      required: [signalId, code, name, valueType, signalKind, semanticCode, featured, status, freshness, validationFlags, stale]
      properties:
        signalId: { type: string, format: uuid }
        componentId: { type: [string, "null"], format: uuid }
        code: { type: string }
        name: { type: string }
        valueType: { $ref: '#/components/schemas/SignalValueType' }
        signalKind: { $ref: '#/components/schemas/SignalKind' }
        semanticCode: { type: string }
        unitCode: { type: [string, "null"] }
        featured: { type: boolean }
        displayOrder: { type: [integer, "null"] }
        status: { $ref: '#/components/schemas/ConfigStatus' }
        lastReceivedValue: { $ref: '#/components/schemas/TelemetryValue' }
        lastReceivedObservedAt: { type: [string, "null"], format: date-time }
        lastReceivedAt: { type: [string, "null"], format: date-time }
        quality:
          oneOf:
            - $ref: '#/components/schemas/TelemetryQuality'
            - type: "null"
        validationFlags:
          type: array
          items: { type: string }
        lastUsableValue: { $ref: '#/components/schemas/TelemetryValue' }
        lastUsableObservedAt: { type: [string, "null"], format: date-time }
        freshness: { $ref: '#/components/schemas/Freshness' }
        dataThrough: { type: [string, "null"], format: date-time }
        calculatedAt: { type: [string, "null"], format: date-time }
        stale: { type: boolean }
    CurrentTelemetryResponse:
      type: object
      required: [machineId, items, currency, truncated]
      properties:
        machineId: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/CurrentSignalValue' }
        currency: { $ref: '#/components/schemas/ProjectionCurrency' }
        truncated:
          type: boolean
          description: True when more than 500 active signals matched; filter by signalId for targeted reads.
    MachineOperationsCurrent:
      type: object
      required: [machine, featuredSignals, currency]
      properties:
        machine: { $ref: '#/components/schemas/Machine' }
        line:
          oneOf:
            - $ref: '#/components/schemas/ProductionLine'
            - type: "null"
        currentState:
          oneOf:
            - $ref: '#/components/schemas/CurrentState'
            - type: "null"
        featuredSignals:
          type: array
          items: { $ref: '#/components/schemas/CurrentSignalValue' }
        currency: { $ref: '#/components/schemas/ProjectionCurrency' }

    StateCount:
      type: object
      required: [state, count]
      properties:
        state: { $ref: '#/components/schemas/MachineState' }
        count: { type: integer, minimum: 0 }
    MachineCurrentCard:
      type: object
      required: [machineId, machineCode, machineName, machineStatus, stale, recalculating]
      properties:
        machineId: { type: string, format: uuid }
        machineCode: { type: string }
        machineName: { type: string }
        machineStatus: { $ref: '#/components/schemas/ConfigStatus' }
        inventoryNo: { type: [string, "null"] }
        currentState:
          oneOf:
            - $ref: '#/components/schemas/CurrentState'
            - type: "null"
        dataThrough: { type: [string, "null"], format: date-time }
        calculatedAt: { type: [string, "null"], format: date-time }
        stale: { type: boolean }
        recalculating: { type: boolean }
    OperationsLine:
      type: object
      required: [lineId, lineCode, lineName, stateCounts, machines]
      properties:
        lineId: { type: string, format: uuid }
        lineCode: { type: string }
        lineName: { type: string }
        stateCounts:
          type: array
          items: { $ref: '#/components/schemas/StateCount' }
        machines:
          type: array
          items: { $ref: '#/components/schemas/MachineCurrentCard' }
    OperationsOverview:
      type: object
      required: [enterpriseId, stateCounts, lines, generatedAt]
      properties:
        enterpriseId: { type: string, format: uuid }
        stateCounts:
          type: array
          items: { $ref: '#/components/schemas/StateCount' }
        staleMachineCount: { type: integer, minimum: 0 }
        recalculatingMachineCount: { type: integer, minimum: 0 }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OperationsLine' }
        generatedAt: { type: string, format: date-time }

    HistoricalMetadata:
      type: object
      required: [requestedFrom, requestedTo, partial, stale, recalculating]
      properties:
        requestedFrom: { type: string, format: date-time }
        requestedTo: { type: string, format: date-time }
        actualFrom: { type: [string, "null"], format: date-time }
        actualTo: { type: [string, "null"], format: date-time }
        dataThrough: { type: [string, "null"], format: date-time }
        calculatedAt: { type: [string, "null"], format: date-time }
        partial: { type: boolean }
        stale: { type: boolean }
        recalculating: { type: boolean }
    MetricDiagnostics:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - PRODUCTION_UNIT_MISMATCH
              - OUTPUT_SIGNAL_MISSING
              - SCRAP_SIGNAL_MISSING
              - NOMINAL_RATE_MISSING
              - SCRAP_EXCEEDS_OUTPUT
              - PARTIAL_COVERAGE
        machineIdsWithoutOutput:
          type: array
          items: { type: string, format: uuid }
        machineIdsWithoutNominalRate:
          type: array
          items: { type: string, format: uuid }
        productionUnits:
          type: array
          uniqueItems: true
          items: { type: string }
    Metrics:
      type: object
      required:
        - coveredSec
        - runSec
        - idleSec
        - downSec
        - setupSec
        - plannedStopSec
        - effectiveOfflineSec
        - underlyingOfflineSec
        - stopCount
        - failureCount
        - recoveryCount
        - diagnostics
      properties:
        coveredSec: { type: number, minimum: 0 }
        runSec: { type: number, minimum: 0 }
        idleSec: { type: number, minimum: 0 }
        downSec: { type: number, minimum: 0 }
        setupSec: { type: number, minimum: 0 }
        plannedStopSec: { type: number, minimum: 0 }
        effectiveOfflineSec: { type: number, minimum: 0 }
        underlyingOfflineSec: { type: number, minimum: 0 }
        plannedProductionSec: { type: number, minimum: 0 }
        operatingSec: { type: number, minimum: 0 }
        productiveSec: { type: number, minimum: 0 }
        output: { type: [number, "null"] }
        scrap: { type: [number, "null"] }
        goodOutput: { type: [number, "null"] }
        idealOutput: { type: [number, "null"] }
        productionUnit: { type: [string, "null"] }
        stopCount: { type: integer, format: int64, minimum: 0 }
        failureCount: { type: integer, format: int64, minimum: 0 }
        recoveryCount: { type: integer, format: int64, minimum: 0 }
        availability: { type: [number, "null"], minimum: 0, maximum: 1 }
        performance: { type: [number, "null"], minimum: 0 }
        quality: { type: [number, "null"], minimum: 0, maximum: 1 }
        oee: { type: [number, "null"], minimum: 0 }
        dataCoverage: { type: [number, "null"], minimum: 0, maximum: 1 }
        mtbfSec: { type: [number, "null"], minimum: 0 }
        mttrSec: { type: [number, "null"], minimum: 0 }
        diagnostics: { $ref: '#/components/schemas/MetricDiagnostics' }
    MetricPeriod:
      type: object
      required: [metadata, metrics]
      properties:
        metadata: { $ref: '#/components/schemas/HistoricalMetadata' }
        metrics: { $ref: '#/components/schemas/Metrics' }
    AnalyticsSummary:
      type: object
      required: [scope, scopeId, current]
      properties:
        scope: { $ref: '#/components/schemas/AnalyticsScope' }
        scopeId: { type: string, format: uuid }
        shiftId: { type: [string, "null"], format: uuid }
        shiftDate: { type: [string, "null"], format: date }
        current: { $ref: '#/components/schemas/MetricPeriod' }
        previous:
          oneOf:
            - $ref: '#/components/schemas/MetricPeriod'
            - type: "null"

    MetricPoint:
      type: object
      required: [bucketStart, bucketEnd, metrics]
      properties:
        bucketStart: { type: string, format: date-time }
        bucketEnd: { type: string, format: date-time }
        metrics: { $ref: '#/components/schemas/Metrics' }
    MetricTimeseries:
      type: object
      required: [scope, scopeId, metadata, resolution, points]
      properties:
        scope: { $ref: '#/components/schemas/AnalyticsScope' }
        scopeId: { type: string, format: uuid }
        shiftId: { type: [string, "null"], format: uuid }
        metadata: { $ref: '#/components/schemas/HistoricalMetadata' }
        resolution: { $ref: '#/components/schemas/AppliedResolution' }
        points:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/MetricPoint' }

    TelemetrySeriesMetadata:
      allOf:
        - $ref: '#/components/schemas/HistoricalMetadata'
        - type: object
          required: [resolution]
          properties:
            resolution: { $ref: '#/components/schemas/AppliedResolution' }
    GaugePoint:
      type: object
      required: [bucketStart, bucketEnd, sampleCount, usableCount, goodCount, uncertainCount, badCount]
      properties:
        bucketStart: { type: string, format: date-time }
        bucketEnd: { type: string, format: date-time }
        min: { type: [number, "null"] }
        max: { type: [number, "null"] }
        avg: { type: [number, "null"] }
        first: { type: [number, "null"] }
        last: { type: [number, "null"] }
        sampleCount: { type: integer, format: int64, minimum: 0 }
        usableCount: { type: integer, format: int64, minimum: 0 }
        goodCount: { type: integer, format: int64, minimum: 0 }
        uncertainCount: { type: integer, format: int64, minimum: 0 }
        badCount: { type: integer, format: int64, minimum: 0 }
    CounterPoint:
      type: object
      required: [bucketStart, bucketEnd, resetCount, sampleCount, usableCount, goodCount, uncertainCount, badCount]
      properties:
        bucketStart: { type: string, format: date-time }
        bucketEnd: { type: string, format: date-time }
        first: { type: [number, "null"] }
        last: { type: [number, "null"] }
        delta: { type: [number, "null"] }
        resetCount: { type: integer, format: int64, minimum: 0 }
        sampleCount: { type: integer, format: int64, minimum: 0 }
        usableCount: { type: integer, format: int64, minimum: 0 }
        goodCount: { type: integer, format: int64, minimum: 0 }
        uncertainCount: { type: integer, format: int64, minimum: 0 }
        badCount: { type: integer, format: int64, minimum: 0 }
    TelemetrySeries:
      type: object
      required: [machineId, signal, metadata, points]
      properties:
        machineId: { type: string, format: uuid }
        signal: { $ref: '#/components/schemas/TelemetrySignal' }
        metadata: { $ref: '#/components/schemas/TelemetrySeriesMetadata' }
        points:
          type: array
          maxItems: 720
          items:
            anyOf:
              - $ref: '#/components/schemas/GaugePoint'
              - $ref: '#/components/schemas/CounterPoint'

    LossBucketKind:
      type: string
      enum: [REASON, UNCLASSIFIED, OTHER]
    LossReasonDuration:
      type: object
      required: [kind, durationSec]
      properties:
        kind: { $ref: '#/components/schemas/LossBucketKind' }
        reasonId: { type: [string, "null"], format: uuid }
        reasonCode: { type: [string, "null"] }
        reasonName: { type: [string, "null"] }
        category:
          oneOf:
            - $ref: '#/components/schemas/LossCategory'
            - type: "null"
        color: { type: [string, "null"] }
        durationSec: { type: number, minimum: 0 }
    LossPoint:
      type: object
      required: [bucketStart, bucketEnd, idleSec, downSec, setupSec, plannedStopSec, unclassifiedLossSec, byReason]
      properties:
        bucketStart: { type: string, format: date-time }
        bucketEnd: { type: string, format: date-time }
        idleSec: { type: number, minimum: 0 }
        downSec: { type: number, minimum: 0 }
        setupSec: { type: number, minimum: 0 }
        plannedStopSec: { type: number, minimum: 0 }
        unclassifiedLossSec: { type: number, minimum: 0 }
        byReason:
          type: array
          items: { $ref: '#/components/schemas/LossReasonDuration' }
    LossTimeseries:
      type: object
      required: [scope, scopeId, metadata, resolution, points]
      properties:
        scope: { $ref: '#/components/schemas/AnalyticsScope' }
        scopeId: { type: string, format: uuid }
        shiftId: { type: [string, "null"], format: uuid }
        metadata: { $ref: '#/components/schemas/HistoricalMetadata' }
        resolution: { $ref: '#/components/schemas/AppliedResolution' }
        points:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/LossPoint' }
    ParetoRow:
      allOf:
        - $ref: '#/components/schemas/LossReasonDuration'
        - type: object
          required: [share, cumulativeShare]
          properties:
            share: { type: number, minimum: 0, maximum: 1 }
            cumulativeShare: { type: number, minimum: 0, maximum: 1 }
    LossPareto:
      type: object
      required: [scope, scopeId, metadata, totalLossSec, rows]
      properties:
        scope: { $ref: '#/components/schemas/AnalyticsScope' }
        scopeId: { type: string, format: uuid }
        shiftId: { type: [string, "null"], format: uuid }
        shiftDate: { type: [string, "null"], format: date }
        metadata: { $ref: '#/components/schemas/HistoricalMetadata' }
        totalLossSec: { type: number, minimum: 0 }
        plannedStopSec: { type: number, minimum: 0 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ParetoRow' }

    StateDuration:
      type: object
      required: [state, durationSec]
      properties:
        state: { $ref: '#/components/schemas/MachineState' }
        durationSec: { type: number, minimum: 0 }
    EffectiveStateInterval:
      type: object
      required: [from, to, durationSec, effectiveState, calculatedState, stateSource, underlyingOffline]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time, description: Clipped boundary внутри запрошенного готового диапазона. }
        durationSec: { type: number, exclusiveMinimum: 0 }
        openEnded: { type: boolean, default: false }
        effectiveState: { $ref: '#/components/schemas/MachineState' }
        calculatedState: { $ref: '#/components/schemas/MachineState' }
        stateSource: { $ref: '#/components/schemas/StateSource' }
        stateIncidentId: { type: [string, "null"], format: uuid }
        reasonIncidentId: { type: [string, "null"], format: uuid }
        lossReason:
          oneOf:
            - $ref: '#/components/schemas/LossReasonSummary'
            - type: "null"
        telemetryQuality: { $ref: '#/components/schemas/EvaluationQuality' }
        underlyingOffline: { type: boolean }
    ChronometryOccurrence:
      type: object
      required: [shiftId, shiftCode, shiftName, shiftDate, occurrenceFrom, occurrenceTo, actualTo, partial, totals, intervals]
      properties:
        shiftId: { type: string, format: uuid }
        shiftCode: { type: string }
        shiftName: { type: string }
        shiftDate: { type: string, format: date }
        occurrenceFrom: { type: string, format: date-time }
        occurrenceTo: { type: string, format: date-time }
        actualTo: { type: string, format: date-time }
        partial: { type: boolean }
        totals:
          type: array
          items: { $ref: '#/components/schemas/StateDuration' }
        intervals:
          type: array
          items: { $ref: '#/components/schemas/EffectiveStateInterval' }
    ChronometryResponse:
      type: object
      required: [machineId, shiftDate, occurrences, currency]
      properties:
        machineId: { type: string, format: uuid }
        shiftDate: { type: string, format: date }
        occurrences:
          type: array
          items: { $ref: '#/components/schemas/ChronometryOccurrence' }
        currency: { $ref: '#/components/schemas/ProjectionCurrency' }

    StateIntervalPage:
      type: object
      required: [machineId, requestedFrom, requestedTo, items, cursor, currency, partial]
      properties:
        machineId: { type: string, format: uuid }
        requestedFrom: { type: string, format: date-time }
        requestedTo: { type: string, format: date-time }
        actualFrom: { type: [string, "null"], format: date-time }
        actualTo: { type: [string, "null"], format: date-time }
        partial: { type: boolean }
        items:
          type: array
          items: { $ref: '#/components/schemas/EffectiveStateInterval' }
        cursor: { $ref: '#/components/schemas/CursorMetadata' }
        currency: { $ref: '#/components/schemas/ProjectionCurrency' }

    ManualIncidentCreate:
      type: object
      example:
        from: '2026-10-12T08:15:00Z'
        to: null
        stateOverride: SETUP
        lossReasonId: 60000000-0000-0000-0000-000000000001
        comment: Плановая переналадка оборудования
        author: Иван Петров
      additionalProperties: false
      required: [from]
      description: Если to равен null, инцидент продолжается до текущего dataThrough; для reason-only ongoing аннотации from должен быть строго раньше dataThrough машины.
      anyOf:
        - required: [stateOverride]
        - required: [lossReasonId]
      properties:
        from: { type: string, format: date-time }
        to: { type: [string, "null"], format: date-time }
        stateOverride:
          oneOf:
            - $ref: '#/components/schemas/ManualStateOverride'
            - type: "null"
        lossReasonId: { type: [string, "null"], format: uuid }
        comment: { type: [string, "null"], maxLength: 500 }
        author:
          type: [string, "null"]
          maxLength: 100
          description: Подпись автора, переданная вызывающей стороной для отображения; это не подтверждённая личность и не identity claim.
    ManualIncidentUpdate:
      type: object
      example:
        from: '2026-10-12T08:15:00Z'
        to: '2026-10-12T09:00:00Z'
        stateOverride: SETUP
        lossReasonId: 60000000-0000-0000-0000-000000000001
        comment: Плановая переналадка завершена
      additionalProperties: false
      required: [from]
      anyOf:
        - required: [stateOverride]
        - required: [lossReasonId]
      properties:
        from: { type: string, format: date-time }
        to: { type: [string, "null"], format: date-time }
        stateOverride:
          oneOf:
            - $ref: '#/components/schemas/ManualStateOverride'
            - type: "null"
        lossReasonId: { type: [string, "null"], format: uuid }
        comment: { type: [string, "null"], maxLength: 500 }
    ManualIncidentClose:
      type: object
      example: { to: '2026-10-12T09:00:00Z' }
      additionalProperties: false
      required: [to]
      properties:
        to: { type: string, format: date-time }
    ManualIncident:
      type: object
      required: [id, machineId, machine, from, effectType, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        machineId: { type: string, format: uuid }
        machine: { $ref: '#/components/schemas/MachineReference' }
        from: { type: string, format: date-time }
        to: { type: [string, "null"], format: date-time }
        stateOverride:
          oneOf:
            - $ref: '#/components/schemas/ManualStateOverride'
            - type: "null"
        lossReason:
          oneOf:
            - $ref: '#/components/schemas/LossReasonSummary'
            - type: "null"
        effectType: { $ref: '#/components/schemas/IncidentEffectType' }
        comment: { type: [string, "null"] }
        author: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
        recalculating: { type: boolean, default: true }
    MachineReference:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        lineId: { type: [string, "null"], format: uuid }
        lineCode: { type: [string, "null"] }
        lineName: { type: [string, "null"] }
    ManualIncidentPage:
      type: object
      required: [items, cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ManualIncident' }
        cursor: { $ref: '#/components/schemas/CursorMetadata' }

    RecalculationScope:
      type: string
      enum: [PERIOD, ALL]
    StateRecalculationCreate:
      type: object
      example: { scope: PERIOD, from: '2026-10-01T00:00:00Z', to: '2026-10-02T00:00:00Z' }
      additionalProperties: false
      required: [scope]
      properties:
        scope: { $ref: '#/components/schemas/RecalculationScope' }
        from: { type: [string, "null"], format: date-time }
        to: { type: [string, "null"], format: date-time }
      description: PERIOD требует from/to; ALL запрещает их.
    JobError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
    StateRecalculation:
      type: object
      required: [id, machineId, scope, status, progress, createdAt]
      properties:
        id: { type: string, format: uuid }
        machineId: { type: string, format: uuid }
        scope: { $ref: '#/components/schemas/RecalculationScope' }
        requestedFrom: { type: [string, "null"], format: date-time }
        requestedTo: { type: [string, "null"], format: date-time }
        effectiveFrom: { type: [string, "null"], format: date-time }
        effectiveTo: { type: [string, "null"], format: date-time }
        status: { $ref: '#/components/schemas/RecalculationStatus' }
        progress: { type: number, minimum: 0, maximum: 1 }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        error:
          oneOf:
            - $ref: '#/components/schemas/JobError'
            - type: "null"
    StateRecalculationPage:
      type: object
      required: [items, cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StateRecalculation' }
        cursor: { $ref: '#/components/schemas/CursorMetadata' }
