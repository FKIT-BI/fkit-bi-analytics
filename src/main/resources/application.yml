spring:
  application:
    name: fkit-bi-analytics
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fkit_bi}
    username: ${SPRING_DATASOURCE_USERNAME:fkit_bi}
    password: ${SPRING_DATASOURCE_PASSWORD:fkit_bi}
    hikari:
      connection-timeout: 2000
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  mvc:
    problemdetails:
      enabled: false
server:
  forward-headers-strategy: framework
springdoc:
  swagger-ui:
    url: ../openapi/analytics-api-draft.yaml
    config-url: ../v3/api-docs/swagger-config
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: true
  show-actuator: false
fkit:
  schema:
    expected-release: 002-authentication
  auth:
    jwt-secret: ${FKIT_JWT_SECRET:}
    trusted-proxy-cidrs: ${FKIT_TRUSTED_PROXY_CIDRS:}
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,schemaRelease
          show-details: always
        liveness:
          include: livenessState
    prometheus:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
info:
  fkit:
    git-sha: ${FKIT_BI_GIT_SHA:unknown}
