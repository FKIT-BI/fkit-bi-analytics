name: CI and Dev delivery
on:
  pull_request: {branches: [develop]}
  push: {branches: [develop]}
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: fkit-bi-analytics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./mvnw -B verify
      - run: docker build -t fkit-bi-analytics:${{ github.sha }} .
  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/fkit-bi/fkit-bi-analytics:dev,ghcr.io/fkit-bi/fkit-bi-analytics:${{ github.sha }}
      - name: Report disabled Dev deployment
        if: vars.FKIT_BI_DEV_DEPLOY_ENABLED != 'true'
        run: echo 'Dev deployment is disabled by FKIT_BI_DEV_DEPLOY_ENABLED.' >> "$GITHUB_STEP_SUMMARY"
  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.FKIT_BI_DEV_DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FKIT_BI_DEV_HOST: ${{ vars.FKIT_BI_DEV_HOST }}
      FKIT_BI_DEV_SSH_USER: ${{ vars.FKIT_BI_DEV_SSH_USER }}
      FKIT_BI_DEV_SSH_PORT: ${{ vars.FKIT_BI_DEV_SSH_PORT }}
      FKIT_BI_DEV_DEPLOY_PATH: ${{ vars.FKIT_BI_DEV_DEPLOY_PATH }}
      FKIT_BI_DEV_SSH_KNOWN_HOSTS: ${{ vars.FKIT_BI_DEV_SSH_KNOWN_HOSTS }}
    steps:
      - name: Diagnose GitHub OIDC claims
        env:
          OIDC_AUDIENCE: https://github.com/FKIT-BI
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail --get \
            --data-urlencode "audience=${OIDC_AUDIENCE}" \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          oidc_jwt="$(printf '%s' "$response" | jq -er '.value')"
          unset response
          OIDC_JWT="$oidc_jwt" node -e '
            const payload = JSON.parse(Buffer.from(process.env.OIDC_JWT.split(".")[1], "base64url").toString("utf8"));
            const keys = ["iss", "aud", "sub", "repository", "repository_owner", "ref", "event_name", "workflow_ref", "job_workflow_ref"];
            const diagnostic = Object.fromEntries(keys.filter((key) => payload[key] !== undefined).map((key) => [key, payload[key]]));
            console.log(JSON.stringify(diagnostic, null, 2));
          '
          unset oidc_jwt OIDC_JWT
      - name: Load Analytics deployment credentials from Infisical
        uses: Infisical/secrets-action@8a06c1bdcd5b8635d510c52d4b57a92c1ccef785 # v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.FKIT_BI_INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/FKIT-BI
          domain: https://secrets.kitexp.ru
          project-slug: ${{ vars.FKIT_BI_INFISICAL_PROJECT_SLUG }}
          env-slug: dev
          secret-path: /github-actions/analytics
      - name: Deploy Analytics image
        env:
          GH_TOKEN: ${{ secrets.FKIT_BI_GITHUB_TOKEN }}
        run: gh repo clone FKIT-BI/fkit-bi-infra ../infra -- --branch develop
      - name: Apply Analytics image
        run: ../infra/scripts/deploy-service.sh analytics ghcr.io/fkit-bi/fkit-bi-analytics:${{ github.sha }} ${{ github.sha }}
      - name: Report Analytics delivery
        run: 'echo "Analytics image deployed: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"'
